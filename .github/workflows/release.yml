# Builds the add-in and publishes a downloadable release when you push a version
# tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`). End users then grab the
# zip and run install.ps1 — no .NET SDK or building on their side.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required for the GITHUB_TOKEN to create a release

jobs:
  release:
    name: Build add-in and publish release
    runs-on: windows-latest # net48 / net8.0-windows are Windows-only
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build add-in (Release, 2024 + 2026)
        run: dotnet build RevitMCP.Addin/RevitMCP.Addin.csproj -c Release

      - name: Build add-in (Release, 2025)
        run: dotnet build RevitMCP.Addin/RevitMCP.Addin.csproj -c Release -p:RevitVersion=2025

      - name: Package add-in + installer
        shell: pwsh
        run: |
          # Layout: RevitMCP-addin/<year>/{RevitMCP.Addin.dll, deps, RevitMCP.addin}
          #         RevitMCP-addin/install.ps1
          $stage = "dist/RevitMCP-addin"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($y in 2024, 2025, 2026) {
            $src = "RevitMCP.Addin/bin/Release/$y"
            if (-not (Test-Path "$src/RevitMCP.Addin.dll")) { throw "Missing build for Revit $y" }
            New-Item -ItemType Directory -Force -Path "$stage/$y" | Out-Null
            Copy-Item "$src/*.dll"  "$stage/$y"
            Copy-Item RevitMCP.Addin/RevitMCP.addin "$stage/$y"
          }
          Copy-Item install.ps1 $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/RevitMCP-addin.zip" -Force

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # idempotent: a tag push can fire the workflow twice - the second run only replaces the asset
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/RevitMCP-addin.zip --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME `
              dist/RevitMCP-addin.zip `
              --title "RevitMCP $env:GITHUB_REF_NAME" `
              --generate-notes
          }
